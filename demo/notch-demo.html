<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Englishwords · 刘海查词</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --desk: #dee8f6;
    --sky: #f0f5fc;
    --haze: #ccdcf3;
    --fold: #b1c7e9;
    --fold-light: #e1ebfa;
    --fold-deep: #91abd4;
    --ink: #182331;
    --secondary: #46566d;
    --hint: #4c607b;
    --accent: #235ab3;
    --sheet: #f9fbff;
    --chrome: rgba(246, 250, 255, .74);
    --edge: rgba(255, 255, 255, .83);
    --rule: rgba(47, 74, 116, .17);
    --track: rgba(70, 93, 133, .105);
    --lens: #fbfdff;
    --selected: #e1edff;
    --shadow: 0 14px 42px -22px rgba(28, 52, 95, .45);
    --panel: #141720;
    --panel-text: #f6f7fb;
    --panel-sub: #bcc5d6;
    --panel-accent: #a9ccff;
    --panel-control: #303542;
    --panel-line: rgba(205, 220, 252, .17);
    --focus: #1153af;
    --spring: cubic-bezier(.22,.84,.2,1);
    --settle: cubic-bezier(.2,.68,.24,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #152138;
      --sky: #202d48;
      --haze: #1f3558;
      --fold: #273f67;
      --fold-light: #374f78;
      --fold-deep: #121f37;
      --ink: #eef3ff;
      --secondary: #bdcbe1;
      --hint: #b1c2da;
      --accent: #a7caff;
      --sheet: #222c40;
      --chrome: rgba(30, 42, 63, .83);
      --edge: rgba(189, 212, 255, .24);
      --rule: rgba(193, 213, 246, .2);
      --track: rgba(0, 7, 24, .32);
      --lens: #3c4d67;
      --selected: #324e75;
      --shadow: 0 18px 48px -22px rgba(2, 8, 20, .85);
      --focus: #afcfff;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { min-height: 100%; background: var(--desk); }
  body {
    margin: 0; color: var(--ink); min-width: 0;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  button {
    font: inherit; color: inherit; border: 0; padding: 0;
    background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:disabled { cursor: default; }
  button:focus-visible, summary:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .icon { width: 1.125rem; height: 1.125rem; flex: none; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .symbols { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
  .wallpaper {
    position: fixed; z-index: -1; inset: 0; overflow: hidden; pointer-events: none;
    background: radial-gradient(ellipse at 12% 5%, var(--sky) 0, transparent 52%),
                linear-gradient(137deg, var(--desk) 6%, var(--haze) 100%);
  }
  .wallpaper::before, .wallpaper::after {
    content: ""; position: absolute; border-radius: 50%;
    width: 152%; height: 139%; left: -76%; top: 22%; transform: rotate(-34deg);
    background: linear-gradient(178deg, var(--fold-light), var(--haze) 13%, var(--fold) 46%, var(--fold-deep) 96%);
    box-shadow: inset 0 .8px 0 var(--edge), 0 -15px 95px -34px var(--fold-deep);
  }
  .wallpaper::after {
    width: 162%; height: 156%; left: 15%; top: 37%; transform: rotate(-31deg);
    background: linear-gradient(156deg, var(--fold-light) 5%, var(--fold) 33%, var(--fold-deep) 72%);
  }
  .workspace-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .workspace-top {
    display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
    align-items: start; padding-inline: clamp(1rem, 3vw, 2.75rem);
    position: relative; z-index: 3;
  }
  .brand, .help > summary { display: inline-flex; align-items: center; min-height: 44px; }
  .brand { grid-column: 1; grid-row: 1; gap: .65rem; margin-top: max(14px, env(safe-area-inset-top)); width: max-content; }
  .app-mark {
    width: 33px; height: 33px; display: grid; place-items: center; color: #f7fbff;
    background: linear-gradient(145deg, #628ee8, #294d9b);
    box-shadow: inset 0 1px 1px #a1bfff, inset 0 -1px 2px #234584, 0 4px 8px -5px #254988;
    border-radius: 10px;
  }
  .app-mark .icon { width: 20px; height: 20px; }
  .wordmark { font-size: 1.08rem; font-weight: 680; letter-spacing: -.035em; }
  .help { grid-column: 3; grid-row: 1; margin-top: max(14px, env(safe-area-inset-top)); justify-self: end; position: relative; }
  .help > summary {
    gap: 7px; padding: 0 14px; list-style: none; cursor: pointer; border-radius: 30px;
    color: var(--secondary); font-size: .84rem; font-weight: 550;
  }
  .help > summary::-webkit-details-marker { display: none; }
  .help summary .icon { width: 17px; }
  .help[open] > summary, .help > summary:hover { background: var(--chrome); }
  .help-body {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 4;
    width: min(17.5rem, calc(100vw - 2rem)); padding: 1rem 1.15rem; border-radius: 20px;
    color: var(--secondary); background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow);
    font-size: .85rem; line-height: 1.65;
  }
  .help-body p + p { margin-top: .65rem; }
  kbd {
    color: var(--ink); font: 600 .78rem ui-monospace, SFMono-Regular, Consolas, monospace;
    border: 1px solid var(--rule); border-radius: 5px; padding: 1px 4px; white-space: nowrap;
  }
  .notch-layer { grid-column: 2; grid-row: 1; display: flex; align-items: start; justify-content: center; min-height: 70px; min-width: 0; }
  .notch {
    --focus: #b6d3ff;
    width: min(16rem, calc(100vw - 1.5rem)); color: var(--panel-text); background: #0d1017;
    border-radius: 0 0 20px 20px; overflow: clip;
    box-shadow: inset 0 -1px 0 rgba(196,211,241,.22), 0 9px 18px -10px rgba(11,20,39,.63);
    transition: width 370ms var(--spring), border-radius 320ms var(--spring), box-shadow 270ms ease-out;
  }
  .notch.open {
    width: min(31.5rem, calc(100vw - 1.5rem)); border-radius: 0 0 29px 29px;
    box-shadow: 0 27px 48px -22px rgba(8,17,39,.64), 0 4px 9px -5px rgba(12,18,36,.46);
  }
  .island-toggle {
    width: 100%; min-height: calc(44px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 16px 0;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    letter-spacing: -.01em; font-size: .84rem; line-height: 1.3;
  }
  .island-toggle:focus-visible { outline-offset: -4px; border-radius: inherit; }
  .island-toggle > .icon:first-child { width: 15px; height: 15px; color: var(--panel-accent); }
  .island-toggle strong { font-weight: 650; }
  .summary { color: var(--panel-sub); text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
  .chevron { width: 14px; height: 14px; color: var(--panel-sub); transition: transform 300ms var(--spring); }
  .open .island-toggle { justify-content: flex-start; padding-inline: 21px; }
  .open .island-toggle .summary { margin-left: auto; }
  .open .chevron { transform: rotate(180deg); }
  .expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 350ms var(--spring); }
  .open .expand { grid-template-rows: 1fr; }
  .expand-inner { min-height: 0; overflow: hidden; }
  .panel {
    padding: 1.05rem 1.35rem 1rem; background: var(--panel);
    border: 1px solid var(--panel-line); border-bottom-left-radius: 29px; border-bottom-right-radius: 29px;
    opacity: 0; transform: translateY(-6px);
    transition: opacity 115ms ease-out, transform 180ms var(--settle);
  }
  .open .panel { opacity: 1; transform: none; transition-duration: 200ms, 280ms; }
  .word-head { display: flex; align-items: start; gap: .8rem; }
  .name-block { flex: 1; min-width: 0; }
  .word { font-size: clamp(1.65rem, 5vw, 2.2rem); line-height: 1.12; letter-spacing: -.055em; overflow-wrap: anywhere; }
  .phon { color: var(--panel-sub); font-size: .88rem; margin-top: .28rem; line-height: 1.45; }
  .voice-message { color: var(--panel-accent); font-size: .8rem; line-height: 1.5; margin-top: .4rem; }
  .actions { display: flex; gap: 5px; }
  .icon-btn {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
    background: linear-gradient(155deg, rgba(255,255,255,.075), transparent), var(--panel-control);
    border: 1px solid var(--panel-line); box-shadow: inset 0 .5px 0 rgba(255,255,255,.19);
    transition: background-color 170ms, color 160ms, transform 135ms var(--settle);
  }
  .icon-btn[aria-pressed="true"] { background-color: #334a6d; color: var(--panel-accent); }
  .icon-btn:disabled { color: #a1aabb; opacity: .75; }
  @media (hover: hover) { .icon-btn:hover:not(:disabled) { background-color: #424a5a; } }
  .icon-btn:active:not(:disabled), .method:active, .example-word:active { transform: scale(.95); }
  .definition { display: flex; align-items: baseline; gap: .65rem; margin-top: .85rem; line-height: 1.45; }
  .pos { color: var(--panel-accent); font: italic .84rem Georgia, serif; flex: none; }
  .meaning { font-size: 1.08rem; font-weight: 580; }
  .tags { display: inline-flex; flex-wrap: wrap; gap: 5px; margin-left: auto; align-self: center; }
  .tag { font-size: .7rem; font-weight: 550; color: var(--panel-sub); background: #292e39; border-radius: 5px; padding: 2px 5px; }
  .morph { border-top: 1px solid var(--panel-line); margin-top: .95rem; padding-top: .85rem; }
  .section-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .55rem; }
  .section-head h3, .section-head h2 { font-size: .84rem; font-weight: 650; }
  .count { color: var(--panel-sub); font-size: .74rem; }
  .segments { display: flex; flex-wrap: wrap; gap: 6px; }
  .segment { flex: 1 1 5.6rem; border-radius: 11px; background: #212632; padding: .55rem .7rem; min-width: 0; }
  .role { display: block; color: var(--panel-sub); font-size: .69rem; }
  .part { display: block; color: var(--panel-accent); font-size: 1.13rem; font-weight: 620; line-height: 1.3; letter-spacing: -.025em; overflow-wrap: anywhere; }
  .segment[data-role="root"] .part { color: var(--panel-text); }
  .segment[data-role="suffix"] .part { font-style: italic; }
  .gloss { display: block; font-size: .78rem; color: #d5dae6; line-height: 1.45; }
  .origin { color: var(--panel-sub); font-size: .78rem; line-height: 1.65; margin-top: .62rem; }
  .origin b { color: #e3e9f5; font-weight: 550; }
  .dicts { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; margin-top: .55rem; }
  .dicts .label { color: var(--panel-sub); font-size: .75rem; margin-right: .2rem; }
  .dict { min-width: 44px; min-height: 44px; position: relative; z-index: 0; padding: 0 9px; border-radius: 18px; color: var(--panel-sub); font-size: .77rem; }
  .dict::before { content: ""; position: absolute; z-index: -1; inset: 8px 0; border-radius: inherit; }
  .dict[aria-pressed="true"] { color: var(--panel-accent); font-weight: 620; }
  .dict[aria-pressed="true"]::before { background: #293a55; }
  .dict:hover::before { box-shadow: inset 0 0 0 1px var(--panel-line); }
  .subs-list { list-style: none; margin: 0; padding: 0; }
  .sub-row {
    width: 100%; display: grid; grid-template-columns: 2.85rem 1fr; gap: .35rem;
    padding: .62rem .65rem; text-align: left; min-height: 44px; border-radius: 12px; line-height: 1.4;
  }
  .sub-row[aria-pressed="true"] { background: #26364e; box-shadow: inset 3px 0 #a9ccff; }
  .sub-time { color: var(--panel-accent); font: .73rem/1.7 ui-monospace, monospace; }
  .sub-en { display: block; font-size: .88rem; }
  .sub-zh { display: block; color: var(--panel-sub); font-size: .78rem; margin-top: 2px; }
  .reading-stage {
    flex: 1; width: min(calc(100% - 3rem), 47rem); margin-inline: auto;
    display: grid; align-content: center; padding-block: clamp(2rem, 8vh, 6.5rem);
  }
  .reading-sheet {
    background: var(--sheet); border-radius: 29px; border: 1px solid var(--edge);
    box-shadow: var(--shadow), 0 2px 8px -6px rgba(31,54,95,.46);
    padding: clamp(1.4rem, 4vw, 2.65rem) clamp(1.4rem, 4.2vw, 3rem);
  }
  .reader-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--secondary); }
  .reader-meta h1 { font-size: .9rem; font-weight: 610; display: flex; align-items: center; gap: .6rem; }
  .reader-meta h1 .icon { color: var(--accent); }
  .position { color: var(--hint); font: 520 .76rem/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .06em; }
  .sentence {
    margin-block: clamp(1.05rem, 3vh, 1.65rem) .9rem;
    font-size: clamp(1.63rem, 3.3vw, 2.5rem); line-height: 1.32; letter-spacing: -.045em; font-weight: 540;
    text-wrap: pretty; overflow-wrap: anywhere;
  }
  .sample-word {
    display: inline-block; min-height: 44px; border-radius: 5px; color: var(--accent);
    background: var(--selected); box-shadow: inset 0 -2px var(--accent);
    font: inherit; letter-spacing: inherit; padding-inline: .06em;
    transition: color 130ms, background-color 130ms;
  }
  .sample-word:hover { background: color-mix(in srgb, var(--accent) 19%, var(--sheet)); }
  .translation { color: var(--secondary); font-size: .98rem; line-height: 1.7; }
  .reader-time { color: var(--hint); margin-top: 1rem; display: flex; align-items: center; gap: .65rem; font: .77rem ui-monospace, monospace; }
  .reader-time progress { flex: 1; height: 4px; accent-color: var(--accent); border: 0; }
  .reader-time progress::-webkit-progress-bar { background: var(--track); border-radius: 8px; }
  .reader-time progress::-webkit-progress-value { background: var(--accent); border-radius: 8px; }
  .dock {
    align-self: center; width: min(calc(100% - 3rem), 47rem);
    margin-bottom: max(clamp(1.25rem, 5vh, 3.25rem), env(safe-area-inset-bottom));
    padding: .65rem .85rem .4rem; border-radius: 27px;
    background: var(--chrome); border: 1px solid var(--edge); box-shadow: var(--shadow), inset 0 -1px 0 var(--rule);
    -webkit-backdrop-filter: blur(22px) saturate(1.18); backdrop-filter: blur(22px) saturate(1.18);
  }
  .method-track {
    position: relative; isolation: isolate; padding: 4px; display: grid;
    grid-template-columns: repeat(5, minmax(0,1fr)); background: var(--track); border-radius: 22px;
  }
  .method-track::before {
    content: ""; position: absolute; z-index: -1; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 8px)/5); transform: translateX(calc(var(--method-index, 0) * 100%));
    border-radius: 19px; background: var(--lens); border: 1px solid var(--edge);
    box-shadow: 0 2px 4px rgba(18,37,72,.14); transition: transform 320ms var(--spring);
  }
  .method {
    min-width: 0; min-height: 44px; border-radius: 19px; color: var(--secondary); gap: 7px;
    display: flex; justify-content: center; align-items: center; font-weight: 550; font-size: .88rem;
    transition: color 140ms, transform 120ms var(--settle);
  }
  .method[aria-pressed="true"] { color: var(--accent); font-weight: 660; }
  .method:hover { color: var(--ink); }
  .words-row { display: flex; align-items: center; gap: .45rem; padding-top: .28rem; }
  .words-label { font-size: .76rem; color: var(--hint); white-space: nowrap; padding-left: .42rem; }
  .word-list { min-width: 0; flex: 1; display: flex; gap: 2px; overflow-x: auto; padding: 3px 4px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  .example-word {
    flex: 1 0 auto; min-height: 44px; position: relative; isolation: isolate; padding-inline: .42rem;
    font-size: .77rem; border-radius: 12px; font-weight: 500; color: var(--secondary);
    transition: color 120ms, transform 120ms var(--settle);
  }
  .example-word::before { content: ""; position: absolute; inset: 8px 0; z-index: -1; border: 1px solid transparent; border-radius: 9px; }
  .example-word[aria-pressed="true"] { color: var(--accent); font-weight: 650; }
  .example-word[aria-pressed="true"]::before { background: var(--selected); border-color: var(--rule); }
  .example-word:hover::before { border-color: var(--rule); }
  .dock:has(.words-row[hidden]) { padding-bottom: .65rem; }
  @media (min-width: 751px) and (max-height: 850px) {
    body:has(.notch.open) .reading-stage { padding-block: 1rem; }
    body:has(.notch.open) .reading-sheet { padding-block: 1.2rem; }
    body:has(.notch.open) .sentence { margin-block: .65rem .4rem; font-size: 1.7rem; }
    body:has(.notch.open) .dock { margin-bottom: 1.1rem; }
  }
  @media (max-width: 56em) {
    .workspace-top { grid-template-columns: 1fr 1fr; }
    .notch-layer { grid-row: 1; grid-column: 1 / -1; min-height: 44px; }
    .brand, .help { grid-row: 2; margin-top: .45rem; }
    .help { grid-column: 2; }
  }
  @media (max-width: 750px) {
    body { height: 100vh; height: 100dvh; min-height: 0; }
    .workspace-content { min-height: 0; overflow-y: auto; scrollbar-width: thin; }
    .reading-stage, .dock { width: min(calc(100% - 2rem), 40rem); }
    .reading-stage { flex: 1 0 auto; padding-block: clamp(1rem, 5vh, 3rem); }
    .dock { flex: none; margin-block: .5rem max(.65rem, env(safe-area-inset-bottom)); }
    .word-list { overscroll-behavior-inline: contain; }
  }
  @media (max-width: 480px) {
    .workspace-top { padding-inline: 1rem; }
    .reading-sheet { border-radius: 23px; }
    .dock { padding: .45rem .45rem .18rem; border-radius: 21px; }
    .method { flex-direction: column; gap: 2px; min-height: 47px; font-size: .7rem; }
    .method .icon { width: 16px; height: 16px; }
    .words-row { gap: 1px; }
    .panel { padding: .85rem 1rem .65rem; }
    .tags { margin-left: 0; }
    .definition { flex-wrap: wrap; gap: .35rem .5rem; }
    .segment { flex-basis: 5rem; }
  }
  @media (prefers-reduced-transparency: reduce) {
    :root { --chrome: var(--sheet); }
    .dock { -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    button:active { transform: none !important; }
  }
  @media (forced-colors: active) {
    .notch, .dock, .reading-sheet, .help-body, .icon-btn { border: 1px solid CanvasText; }
    button[aria-pressed="true"], .sample-word { outline: 2px solid Highlight; outline-offset: -3px; }
  }
</style>

  <div class="notch-layer">
    <section class="notch" id="notch" aria-label="刘海面板">
      <button id="compact" class="island-toggle" aria-expanded="false" aria-controls="expanded">
        <svg class="icon" aria-hidden="true"><use id="compactIcon" href="#i-book"/></svg>
        <strong id="compactWord"></strong><span class="summary" id="compactMeaning"></span>
        <svg class="icon chevron" aria-hidden="true"><use href="#i-down"/></svg>
      </button>
      <div class="expand" id="expanded" inert>
        <div class="expand-inner"><div class="panel">
          <section id="viewLookup" aria-labelledby="pWord">
            <div class="word-head">
              <div class="name-block"><h2 id="pWord" class="word" lang="en"></h2><p id="pPhon" class="phon"></p></div>
              <div class="actions">
                <button class="icon-btn" id="btnSpeak" type="button" aria-label="朗读单词" title="朗读单词"><svg class="icon" aria-hidden="true"><use id="speakIcon" href="#i-sound"/></svg></button>
                <button class="icon-btn" id="btnStar" type="button" aria-label="收藏单词" aria-pressed="false" title="收藏单词"><svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg></button>
              </div>
            </div>
            <p class="voice-message" id="voiceMessage" role="status" hidden></p>
            <div class="definition"><span class="pos" id="pPos"></span><span class="meaning" id="pTrans"></span><span class="tags" id="pTags"></span></div>
            <section class="morph" aria-labelledby="morphTitle">
              <div class="section-head"><h3 id="morphTitle">词根词缀</h3><span class="count" id="segCount"></span></div>
              <div class="segments" id="pSegs"></div><p class="origin" id="pOrigin"></p>
            </section>
            <div class="dicts" id="pDicts" role="group" aria-label="词典">
              <span class="label" aria-hidden="true">词典</span>
              <button class="dict" aria-pressed="true">内置</button><button class="dict" aria-pressed="false">系统词典</button><button class="dict" aria-pressed="false">英汉大词典</button>
            </div>
          </section>
          <section id="viewSubs" aria-label="双语字幕" hidden>
            <ul class="subs-list" id="pSubs"></ul>
          </section>
        </div></div>
      </div>
    </section>
  </div>
  <details class="help" id="help">
    <summary><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg>使用说明</summary>
    <div class="help-body">
      <p>将指针移到顶部刘海，或点选例句中的单词查看释义。按 <kbd>H</kbd> 切换面板，按 <kbd>Esc</kbd> 收起。</p>
      <p>下方可切换取词方式和示例词。字幕来自演示片段，收藏仅在本页有效。朗读使用浏览器语音。</p>
    </div>
  </details>
</header>

<main class="reading-stage">
  <article class="reading-sheet" aria-labelledby="readerLabel">
    <div class="reader-meta">
      <h1><svg class="icon" aria-hidden="true"><use id="readerIcon" href="#i-book"/></svg><span id="readerLabel">阅读片段</span></h1>
      <span class="position" id="position"></span>
    </div>
    <p class="sentence" lang="en" id="sentence"></p>
    <p class="translation" id="translation"></p>
    <div class="reader-time" id="readerTime" hidden><span id="elapsed"></span><progress max="46" id="progress" aria-label="字幕片段进度"></progress><span>0:46</span></div>
  </article>
</main>
</div>

<footer class="dock" aria-label="演示控制">
  <div class="method-track" id="ctrlTrigger" role="group" aria-label="取词方式">
    <button class="method" data-trigger="悬停取词" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-mouse"/></svg>悬停取词</button>
    <button class="method" data-trigger="快捷键查询" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-keys"/></svg>快捷键</button>
    <button class="method" data-trigger="划词查询" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-select"/></svg>划词</button>
    <button class="method" data-trigger="区域取词" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-region"/></svg>区域</button>
    <button class="method" data-trigger="字幕查询" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-sub"/></svg>字幕</button>
  </div>
  <div class="words-row" id="rowWords"><span class="words-label">示例词</span><div class="word-list" id="ctrlWords" role="group" aria-label="选择单词"></div></div>
</footer>
<p role="status" class="sr-only" id="announce"></p>

<script>
const WORDS = {
  abduct: {
    phon: "/əbˈdʌkt/", pos: "vt.", trans: "诱拐；绑架",
    tags: ["大学六级", "托福"],
    segs: [
      { role: "prefix", lab: "ab-",   gl: "离开；脱离" },
      { role: "root",   lab: "duct",  gl: "引导；拉" }
    ],
    origin: "拉丁语 <b>abductus</b>，由 <b>ab-</b>（离开）与 <b>ducere</b>（引导）构成。"
  },
  predict: {
    phon: "/prɪˈdɪkt/", pos: "vt.", trans: "预言；预报",
    tags: ["大学四级", "雅思"],
    segs: [
      { role: "prefix", lab: "pre-", gl: "在前；预先" },
      { role: "root",   lab: "dict", gl: "说；断言" }
    ],
    origin: "拉丁语 <b>praedicere</b>，<b>prae-</b>（在前）+ <b>dicere</b>（说）——事先说出。"
  },
  transport: {
    phon: "/trænˈspɔːrt/", pos: "vt. / n.", trans: "运输；交通",
    tags: ["大学四级", "大学六级"],
    segs: [
      { role: "prefix", lab: "trans-", gl: "穿过；越过" },
      { role: "root",   lab: "port",   gl: "搬运；携带" }
    ],
    origin: "拉丁语 <b>transportare</b>，<b>trans-</b>（越过）+ <b>portare</b>（搬运）。"
  },
  incredible: {
    phon: "/ɪnˈkredəbl/", pos: "adj.", trans: "难以相信的；惊人的",
    tags: ["大学四级", "GRE"],
    segs: [
      { role: "prefix", lab: "in-",   gl: "不；相反" },
      { role: "root",   lab: "cred",  gl: "相信" },
      { role: "suffix", lab: "-ible", gl: "能……的" }
    ],
    origin: "拉丁语 <b>incredibilis</b>，<b>in-</b>（不）+ <b>credere</b>（相信）+ <b>-ibilis</b>（能……的）。"
  },
  abbreviation: {
    phon: "/əˌbriːviˈeɪʃn/", pos: "n.", trans: "缩写；缩略词",
    tags: ["大学六级", "托福"],
    segs: [
      { role: "root",   lab: "abbreviat", gl: "缩短；节略" },
      { role: "suffix", lab: "-ion",      gl: "行为；结果" }
    ],
    origin: "拉丁语 <b>abbreviatio</b>，源自 <b>brevis</b>（短）。"
  },
  consumer: {
    phon: "/kənˈsjuːmər/", pos: "n.", trans: "消费者；用户",
    tags: ["大学四级", "雅思"],
    segs: [
      { role: "prefix", lab: "con-",  gl: "共同；加强" },
      { role: "root",   lab: "sum",   gl: "拿；取用" },
      { role: "suffix", lab: "-er",   gl: "做某事的人" }
    ],
    origin: "拉丁语 <b>consumere</b>，<b>con-</b>（彻底）+ <b>sumere</b>（取用）。"
  },
  project: {
    phon: "/ˈprɒdʒekt/", pos: "n. / vt.", trans: "项目；投射",
    tags: ["大学四级", "大学六级"],
    segs: [
      { role: "prefix", lab: "pro-",  gl: "向前" },
      { role: "root",   lab: "ject",  gl: "投；扔" }
    ],
    origin: "拉丁语 <b>proiectus</b>，<b>pro-</b>（向前）+ <b>iacere</b>（扔）。"
  },
  manuscript: {
    phon: "/ˈmænjuskrɪpt/", pos: "n.", trans: "手稿；原稿",
    tags: ["GRE", "托福"],
    segs: [
      { role: "root",   lab: "manu",   gl: "手" },
      { role: "root",   lab: "script", gl: "写" }
    ],
    origin: "拉丁语 <b>manu scriptum</b>，字面义「用手写成的东西」。"
  }
};

const SUBS = [
  { t: "12.4", en: "The experiment yielded a result nobody expected.",  zh: "这项实验得出了没人预料到的结果。", now: true },
  { t: "15.1", en: "Let me walk you through what actually happened.",    zh: "我来带你看看实际发生了什么。" },
  { t: "18.7", en: "First, we cooled the sample well below zero.",      zh: "首先，我们把样本冷却到零度以下。" },
  { t: "22.3", en: "Then we watched the reaction for six hours.",       zh: "然后我们观察了六小时的反应。" },
  { t: "26.0", en: "The curve started to bend the other way.",          zh: "曲线开始向相反方向弯折。" }
];


const EXAMPLES = {
  abduct: ["The villagers foiled an attempt to ", " the young prince.", "村民们挫败了一起绑架小王子的阴谋。"],
  predict: ["You can’t always ", " where a new idea will take you.", "你无法总是预见一个新想法会将你带向何处。"],
  transport: ["The boats ", " fresh produce across the lake each morning.", "这些船每天早上把新鲜农产品运到湖对岸。"],
  incredible: ["It’s ", " how much a garden can change in a week.", "一座花园在一周内竟然能有这么大的变化。"],
  abbreviation: ["The ", " for a musical instrument can vary across scores.", "同一种乐器在不同乐谱上的缩写可能不同。"],
  consumer: ["Every ", " has the right to know where their food comes from.", "每位消费者都有权知道食物的来源。"],
  project: ["Our next ", " is a map of the city’s forgotten rivers.", "我们的下一个项目，是为这座城市被遗忘的河流绘制地图。"],
  manuscript: ["The editor found a handwritten ", " in the library.", "编辑在图书馆里找到了一份手稿。"]
};
const ROLE = { prefix: "前缀", root: "词根", suffix: "后缀" };
const byId = id => document.getElementById(id);
const notch = byId("notch");
const toggle = byId("compact");
const exampleList = byId("ctrlWords");
const triggerList = byId("ctrlTrigger");
const triggers = [...triggerList.querySelectorAll("button")];
const isSubtitles = () => trigger === "字幕查询";
const marks = new Set();
const words = Object.keys(WORDS);
let word = "abduct";
let trigger = "悬停取词";
let cue = Math.max(0, SUBS.findIndex(line => line.now));
let expanded = false;
let hoverOpen = false;
let enterTimer;
let leaveTimer;
let activeUtterance;
let keyboardNavigation = false;

function setIcon(id, name) {
  byId(id).setAttribute("href", "#i-" + name);
}
function updateHandle() {
  const subs = isSubtitles();
  setIcon("compactIcon", subs ? "sub" : "book");
  byId("compactWord").textContent = expanded ? (subs ? "双语字幕" : "词条释义") : (subs ? "双语字幕" : word);
  byId("compactMeaning").textContent = expanded
    ? (subs ? "演示片段" : trigger)
    : (subs ? SUBS[cue].t + " s" : WORDS[word].trans.split("；")[0]);
  toggle.setAttribute("aria-expanded", String(expanded));
  toggle.setAttribute("aria-label", (expanded ? "收起" : "展开") + (subs ? "字幕面板" : "单词释义，" + word));
}
function setOpen(next, fromHover = false) {
  clearTimeout(enterTimer);
  clearTimeout(leaveTimer);
  hoverOpen = next && fromHover;
  if (next === expanded) return;
  if (!next && byId("expanded").contains(document.activeElement)) toggle.focus({ preventScroll: true });
  expanded = next;
  notch.classList.toggle("open", next);
  byId("expanded").inert = !next;
  updateHandle();
}
function presentPanel() {
  setOpen(true);
  // 小屏上从页面底部换词时，把新结果带回可见区域。
  if (notch.getBoundingClientRect().top < 0) notch.scrollIntoView({ block: "start" });
}
function revealText(element) {
  for (const animation of element.getAnimations()) animation.cancel();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  element.animate([{ opacity: .55, transform: "translateY(3px)" }, { opacity: 1, transform: "none" }],
    { duration: 200, easing: "cubic-bezier(.2,.68,.24,1)" });
}
function updateBookmark() {
  const marked = marks.has(word);
  const button = byId("btnStar");
  button.setAttribute("aria-pressed", String(marked));
  button.title = marked ? "移出收藏" : "收藏单词";
  button.querySelector("svg").style.fill = marked ? "currentColor" : "none";
}
function updateVoice() {
  const button = byId("btnSpeak");
  const title = activeUtterance ? "停止朗读" : "朗读单词";
  button.setAttribute("aria-label", title);
  button.title = button.disabled ? "当前浏览器没有语音功能" : title;
  setIcon("speakIcon", activeUtterance ? "stop" : "sound");
}
function showVoiceMessage(message = "") {
  const text = byId("voiceMessage");
  text.textContent = message;
  text.hidden = !message;
}
function stopVoice() {
  if (!activeUtterance) return;
  activeUtterance = null;
  speechSynthesis.cancel();
  updateVoice();
}
function readAloud() {
  if (activeUtterance) { stopVoice(); return; }
  showVoiceMessage();
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  utterance.rate = .92;
  const finish = event => {
    if (utterance !== activeUtterance) return;
    activeUtterance = null;
    updateVoice();
    if (event.type === "error") showVoiceMessage("朗读失败，可检查浏览器的英语语音后重试。");
  };
  utterance.onend = finish;
  utterance.onerror = finish;
  activeUtterance = utterance;
  updateVoice();
  speechSynthesis.speak(utterance);
}
function updateReader() {
  const subs = isSubtitles();
  const sentence = byId("sentence");
  byId("readerLabel").textContent = subs ? "字幕片段" : "阅读片段";
  setIcon("readerIcon", subs ? "sub" : "book");
  const position = subs ? cue + 1 : words.indexOf(word) + 1;
  const count = subs ? SUBS.length : words.length;
  byId("position").textContent = [position, count].map(n => String(n).padStart(2, "0")).join(" / ");
  byId("readerTime").hidden = !subs;
  if (subs) {
    const line = SUBS[cue];
    sentence.textContent = line.en;
    byId("translation").textContent = line.zh;
    byId("elapsed").textContent = "0:" + Math.floor(Number(line.t)).toString().padStart(2, "0");
    byId("progress").value = Number(line.t);
    return;
  }
  const [before, after, zh] = EXAMPLES[word];
  const sample = document.createElement("button");
  sample.type = "button";
  sample.className = "sample-word";
  sample.textContent = word;
  sample.setAttribute("aria-label", "查看 " + word + " 的释义");
  sample.setAttribute("aria-controls", "expanded");
  sample.addEventListener("click", () => {
    presentPanel();
    if (keyboardNavigation) toggle.focus({ preventScroll: true });
  });
  sentence.replaceChildren(before, sample, after);
  byId("translation").textContent = zh;
}
function renderWord() {
  const entry = WORDS[word];
  showVoiceMessage(byId("btnSpeak").disabled ? "当前浏览器没有提供朗读功能。" : "");
  byId("pWord").textContent = word;
  byId("pPhon").textContent = entry.phon;
  byId("pPos").textContent = entry.pos;
  byId("pTrans").textContent = entry.trans;
  byId("pTags").innerHTML = entry.tags.map(tag => '<span class="tag">' + tag + '</span>').join("");
  byId("pSegs").innerHTML = entry.segs.map(part =>
    '<div class="segment" data-role="' + part.role + '"><span class="role">' + ROLE[part.role]
      + '</span><span class="part" lang="en">' + part.lab + '</span><span class="gloss">' + part.gl + '</span></div>'
  ).join("");
  byId("segCount").textContent = entry.segs.length + " 段";
  byId("pOrigin").innerHTML = "词源 · " + entry.origin;
  for (const button of exampleList.children) button.setAttribute("aria-pressed", String(button.dataset.word === word));
  updateBookmark();
}
function updateCues() {
  for (const button of byId("pSubs").querySelectorAll("button")) {
    button.setAttribute("aria-pressed", String(Number(button.dataset.cue) === cue));
  }
}
function selectTrigger(button, shouldOpen = true) {
  const previousMode = isSubtitles();
  stopVoice();
  if (!byId("btnSpeak").disabled) showVoiceMessage();
  trigger = button.dataset.trigger;
  const subs = isSubtitles();
  triggers.forEach(control => control.setAttribute("aria-pressed", String(control === button)));
  triggerList.style.setProperty("--method-index", triggers.indexOf(button));
  byId("viewLookup").hidden = subs;
  byId("viewSubs").hidden = !subs;
  byId("rowWords").hidden = subs;
  updateReader();
  updateHandle();
  if (shouldOpen && subs !== previousMode) revealText(byId("sentence"));
  if (shouldOpen) presentPanel();
}
toggle.addEventListener("click", () => setOpen(!expanded));
notch.addEventListener("pointerenter", event => {
  if (event.pointerType !== "mouse") return;
  keyboardNavigation = false;
  clearTimeout(leaveTimer);
  if (!expanded) enterTimer = setTimeout(() => setOpen(true, true), 160);
});
notch.addEventListener("pointerleave", event => {
  clearTimeout(enterTimer);
  if (event.pointerType !== "mouse" || !hoverOpen || isSubtitles()) return;
  leaveTimer = setTimeout(() => {
    if (!notch.matches(":hover") && !(keyboardNavigation && notch.contains(document.activeElement))) setOpen(false);
  }, 650);
});
window.addEventListener("pointerdown", () => { keyboardNavigation = false; }, true);
window.addEventListener("keydown", event => {
  keyboardNavigation = true;
  if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey || event.isComposing) return;
  if (event.key === "Escape") {
    if (byId("help").open) {
      byId("help").open = false;
      byId("help").querySelector("summary").focus();
    } else setOpen(false);
    return;
  }
  if (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.repeat) return;
  if (event.key.toLowerCase() === "h" || (event.key === " " && event.target === document.body)) {
    event.preventDefault();
    setOpen(!expanded);
    if (expanded) { toggle.focus({ preventScroll: true }); notch.scrollIntoView({ block: "nearest" }); }
  }
});
document.addEventListener("click", event => {
  if (!byId("help").contains(event.target)) byId("help").open = false;
});
for (const key of words) {
  const button = document.createElement("button");
  button.className = "example-word";
  button.lang = "en";
  button.dataset.word = key;
  button.textContent = key;
  exampleList.append(button);
}
exampleList.addEventListener("click", event => {
  const button = event.target.closest("[data-word]");
  if (!button) return;
  stopVoice();
  const changed = word !== button.dataset.word;
  word = button.dataset.word;
  renderWord();
  updateReader();
  updateHandle();
  if (changed) {
    revealText(byId("sentence"));
    if (expanded) revealText(byId("viewLookup"));
  }
  presentPanel();
  byId("announce").textContent = word + "，" + WORDS[word].trans;
});
triggerList.addEventListener("click", event => {
  const button = event.target.closest("[data-trigger]");
  if (button) selectTrigger(button);
});
byId("pSubs").innerHTML = SUBS.map((line, index) =>
  '<li><button class="sub-row" data-cue="' + index + '"><span class="sub-time">' + line.t
   + ' s</span><span><span class="sub-en" lang="en">' + line.en + '</span><span class="sub-zh">' + line.zh + '</span></span></button></li>'
).join("");
byId("pSubs").addEventListener("click", event => {
  const button = event.target.closest("[data-cue]");
  if (!button) return;
  cue = Number(button.dataset.cue);
  updateCues();
  updateReader();
  updateHandle();
  revealText(byId("sentence"));
});
byId("pDicts").addEventListener("click", event => {
  const button = event.target.closest(".dict");
  if (!button) return;
  for (const choice of byId("pDicts").querySelectorAll("button")) choice.setAttribute("aria-pressed", String(choice === button));
});
byId("btnStar").addEventListener("click", () => {
  if (marks.has(word)) marks.delete(word); else marks.add(word);
  updateBookmark();
});
byId("btnSpeak").addEventListener("click", readAloud);
byId("btnSpeak").disabled = !("speechSynthesis" in window && "SpeechSynthesisUtterance" in window);
updateVoice();
updateCues();
renderWord();
const query = new URLSearchParams(location.search);
selectTrigger(query.get("mode") === "subs" ? triggers.at(-1) : triggers[0], query.get("open") === "1");
</script>
</body>
</html>
