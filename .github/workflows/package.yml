name: Package
# 推送版本 tag 后自动打包，也可手动选择同一版本 tag 补跑。
# 构建两端安装包并上传到对应 Release 草稿。新建草稿时正文留空。
# 已有草稿保留说明并更新同名附件，维护者核对安装包、补写说明后公开发布。
# macOS 为临时签名（ad-hoc），没有 Developer ID，也不公证。Windows 安装包不签名。
#
# 版本号由 resolve-version 解析一次，macOS 与 Windows 共用：
# 手动补跑时，在 Run workflow 的 Use workflow from 里选择 v主.次.修订 形式的 tag。
# 双端均按校验过的 tag 提交构建。
# 该版本写入 macOS 的 CFBundleShortVersionString、DMG/PKG 文件名和 Windows zip 文件名。
# 收尾作业上传解包后的 .dmg、.pkg、.zip 和 .sha256，不再上传 artifact 外面的那层 zip。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version from git tag
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            RAW_TAG="$REF_NAME"
          else
            echo "::error::本次工作流必须从 tag 运行（当前 Use workflow from 选中的是 ${REF_TYPE} '${REF_NAME}'）。请推送形如 v1.2.3 的 tag，并在 Run workflow 时选择该 tag。不会回退到最近的 v* tag，也不会猜测版本号。"
            exit 1
          fi

          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::请使用 v主.次.修订 格式的版本 tag，当前为 '${RAW_TAG}'。"
            exit 1
          fi
          VERSION="${RAW_TAG#v}"

          HEAD_COMMIT=$(git rev-parse HEAD)
          if ! TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/${RAW_TAG}^{commit}"); then
            echo "::error::无法解析 tag '${RAW_TAG}'，不能确认它指向哪个提交。"
            exit 1
          fi

          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::本次运行的提交 $HEAD_COMMIT 与 tag $RAW_TAG 的当前提交 $TAG_COMMIT 不一致，请从该 tag 重新启动 Package。"
            exit 1
          fi
          echo "Version: ${VERSION} (tag: ${RAW_TAG}, commit: ${TAG_COMMIT})"
          {
            echo "tag=${RAW_TAG}"
            echo "version=${VERSION}"
            echo "commit=${TAG_COMMIT}"
          } >> "$GITHUB_OUTPUT"

  build-macos-universal:
    name: macOS Universal DMG & PKG
    needs: resolve-version
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.commit }}
          fetch-depth: 0

      - name: Verify Liquid Glass toolchain
        shell: bash
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::找不到固定的 Xcode 路径：$DEVELOPER_DIR"
            exit 1
          fi
          xcodebuild -version
          swift_version="$(xcrun swift --version)"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf '%s\nmacOS SDK %s\n' "$swift_version" "$sdk_version"
          if ! [[ "$swift_version" =~ Swift\ version\ ([0-9]+)\.([0-9]+) ]] ||
             (( BASH_REMATCH[1] < 6 || (BASH_REMATCH[1] == 6 && BASH_REMATCH[2] < 2) )); then
            echo "::error::原生 Liquid Glass 需要 Swift 6.2 或更新版本"
            exit 1
          fi
          if (( ${sdk_version%%.*} < 26 )); then
            echo "::error::原生 Liquid Glass 需要 macOS SDK 26 或更新版本"
            exit 1
          fi

      - name: Run Tests
        working-directory: macos-starter
        run: bash ./test.sh

      - name: Build Universal App
        working-directory: macos-starter
        env:
          EW_BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
          EW_BUILD_NUMBER: ${{ github.run_number }}
        run: bash ./build.sh

      - name: Verify Liquid Glass in the Universal app
        working-directory: macos-starter
        shell: bash
        run: |
          binary=build/Englishwords.app/Contents/MacOS/Englishwords
          for arch in arm64 x86_64; do
            symbols="$(xcrun nm -arch "$arch" -u "$binary" | xcrun swift-demangle)"
            if [[ "$symbols" != *SwiftUI.View.glassEffect* ]]; then
              echo "::error::${arch} 分片缺少 SwiftUI.View.glassEffect，停止打包"
              exit 1
            fi
          done

      - name: Package DMG & PKG
        working-directory: macos-starter
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Englishwords.app/Contents/Info.plist)"
          if [ "$PLIST_VERSION" != "$VERSION" ]; then
            echo "::error::CFBundleShortVersionString 是 '${PLIST_VERSION}'，与本次版本 '${VERSION}' 不一致。"
            exit 1
          fi

          mkdir -p build/dist

          PKG_NAME="Englishwords-${VERSION}-universal.pkg"
          bash scripts/build-installer.sh build/Englishwords.app "build/dist/$PKG_NAME"
          (cd build/dist && shasum -a 256 "$PKG_NAME" > "$PKG_NAME.sha256")

          DMG_NAME="Englishwords-${VERSION}-universal.dmg"
          STAGING="$(mktemp -d -t englishwords-dmg)"
          trap 'rm -rf "$STAGING"' EXIT
          ROOT="$STAGING/volume"
          mkdir -p "$ROOT"
          # DMG 和直接下载的 PKG 使用同一个安装器，确保执行 postinstall。
          cp "build/dist/$PKG_NAME" "$ROOT/$PKG_NAME"
          cp Resources/安装说明.txt "$ROOT/安装说明.txt"
          hdiutil create -srcfolder "$ROOT" -volname "Englishwords" -format UDZO "$STAGING/$DMG_NAME" >/dev/null
          hdiutil verify "$STAGING/$DMG_NAME" >/dev/null
          mv "$STAGING/$DMG_NAME" "build/dist/$DMG_NAME"
          (cd build/dist && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")

          cp Resources/安装说明.txt build/dist/
          ls -lh build/dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Englishwords-${{ needs.resolve-version.outputs.version }}-universal-macos
          path: |
            macos-starter/build/dist/*.dmg
            macos-starter/build/dist/*.pkg
            macos-starter/build/dist/*.sha256
            macos-starter/build/dist/安装说明.txt
          if-no-files-found: error
          overwrite: true

  build-windows-x64:
    name: Windows x64 ZIP
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.commit }}
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test, Build and Self-Check
        working-directory: windows-starter
        shell: pwsh
        env:
          EW_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EW_VERSION)) {
            Write-Error "缺少版本号。不会使用写死的默认版本。"
            exit 1
          }
          ./build.ps1 -Version $env:EW_VERSION

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Englishwords-${{ needs.resolve-version.outputs.version }}-win-x64-zip
          path: |
            windows-starter/build/dist/*.zip
            windows-starter/build/dist/*.sha256
          if-no-files-found: error
          overwrite: true

  draft-release:
    name: Upload assets to draft release
    needs: [resolve-version, build-macos-universal, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          names=(
            "Englishwords-${VERSION}-universal.dmg"
            "Englishwords-${VERSION}-universal.dmg.sha256"
            "Englishwords-${VERSION}-universal.pkg"
            "Englishwords-${VERSION}-universal.pkg.sha256"
            "Englishwords-${VERSION}-win-x64.zip"
            "Englishwords-${VERSION}-win-x64.zip.sha256"
          )
          for name in "${names[@]}"; do
            found="$(find artifacts -type f -name "$name")"
            count="$(printf '%s\n' "$found" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" -ne 1 ]; then
              echo "::error::期望恰好 1 个 ${name}，实际 ${count} 个。"
              find artifacts -type f -print
              exit 1
            fi
            cp "$found" "release-assets/${name}"
            test -s "release-assets/${name}"
          done
          (
            cd release-assets
            sha256sum -c "Englishwords-${VERSION}-universal.dmg.sha256"
            sha256sum -c "Englishwords-${VERSION}-universal.pkg.sha256"
            sha256sum -c "Englishwords-${VERSION}-win-x64.zip.sha256"
          )
          ls -lh release-assets

      - name: Attach assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          BUILD_COMMIT: ${{ needs.resolve-version.outputs.commit }}
        run: |
          set -euo pipefail

          verify_remote_tag() {
            local object type sha
            local endpoint="repos/$GH_REPO/git/ref/tags/$TAG"
            while true; do
              if ! object="$(gh api "$endpoint" --jq '[.object.type, .object.sha] | @tsv')"; then
                echo "::error::无法读取远端 tag ${TAG}（构建提交 ${BUILD_COMMIT}）。"
                return 1
              fi
              IFS=$'\t' read -r type sha <<< "$object"
              case "$type" in
                commit) break ;;
                tag) endpoint="repos/$GH_REPO/git/tags/$sha" ;;
                *)
                  echo "::error::远端 tag $TAG 的对象类型无效：${type:-未知}（构建提交 ${BUILD_COMMIT}）。"
                  return 1
                  ;;
              esac
            done

            if [[ "$sha" != "$BUILD_COMMIT" ]]; then
              echo "::error::远端 tag $TAG 指向 ${sha:-未知}，与构建提交 $BUILD_COMMIT 不一致。"
              return 1
            fi
          }

          assets=(
            "release-assets/Englishwords-${VERSION}-universal.dmg"
            "release-assets/Englishwords-${VERSION}-universal.dmg.sha256"
            "release-assets/Englishwords-${VERSION}-universal.pkg"
            "release-assets/Englishwords-${VERSION}-universal.pkg.sha256"
            "release-assets/Englishwords-${VERSION}-win-x64.zip"
            "release-assets/Englishwords-${VERSION}-win-x64.zip.sha256"
          )
          if is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"; then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $TAG 已公开，请使用新版本 tag 构建新的 Release 草稿。"
              exit 1
            fi
            echo "更新 Release $TAG 草稿的同名附件。"
            verify_remote_tag
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "创建 Release $TAG 草稿。"
            verify_remote_tag
            gh release create "$TAG" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "Englishwords v${VERSION}" \
              --notes ""
          fi
